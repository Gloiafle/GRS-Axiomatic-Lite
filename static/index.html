<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Twin Sanctuary — Nexus Lens</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* ---- Golden Halo (SYNCED) ---- */
    @keyframes goldenHalo {
      0%, 100% { filter: drop-shadow(0 0 6px rgba(245, 182, 45, 0.4)); }
      50%      { filter: drop-shadow(0 0 18px rgba(245, 182, 45, 0.9)); }
    }
    .golden-halo svg,
    .golden-halo .machine-svg {
      animation: goldenHalo 2.5s ease-in-out infinite;
    }

    /* ---- Amber Drift Pulse (DRIFT_LEVEL_1) ---- */
    @keyframes amberDrift {
      0%, 100% { filter: drop-shadow(0 0 4px rgba(245, 158, 11, 0.3)); opacity: 0.85; }
      50%      { filter: drop-shadow(0 0 22px rgba(245, 158, 11, 0.95)); opacity: 1; }
    }
    .amber-drift svg,
    .amber-drift .machine-svg {
      animation: amberDrift 3.5s ease-in-out infinite;
    }

    /* ---- Crimson Heartbeat (BREACH_LEVEL_2 / STASIS_LOCKED) ---- */
    @keyframes crimsonHeartbeat {
      0%, 100% { filter: drop-shadow(0 0 4px rgba(220, 38, 38, 0.4)); transform: scale(1); }
      15%      { filter: drop-shadow(0 0 28px rgba(220, 38, 38, 1));   transform: scale(1.02); }
      30%      { filter: drop-shadow(0 0 8px rgba(220, 38, 38, 0.5));  transform: scale(1); }
      45%      { filter: drop-shadow(0 0 24px rgba(220, 38, 38, 0.9)); transform: scale(1.015); }
      60%      { filter: drop-shadow(0 0 4px rgba(220, 38, 38, 0.3));  transform: scale(1); }
    }
    .crimson-heartbeat svg,
    .crimson-heartbeat .machine-svg {
      animation: crimsonHeartbeat 1.4s ease-in-out infinite;
    }

    body { background: #0a0e17; }
    .log-entry { border-left: 2px solid #1e293b; }
  </style>
</head>
<body class="min-h-screen text-gray-200 font-mono">

  <!-- ===== Header ===== -->
  <header class="border-b border-gray-800 px-6 py-4 flex items-center justify-between">
    <div>
      <h1 class="text-xl font-bold tracking-wider text-amber-400">DIGITAL TWIN SANCTUARY</h1>
      <p class="text-xs text-gray-500 mt-0.5">Nexus Lens — Real-Time System Viewport</p>
    </div>
    <div id="connection-badge" class="px-3 py-1 rounded text-xs font-semibold bg-gray-800 text-gray-500">
      DISCONNECTED
    </div>
  </header>

  <main class="grid grid-cols-1 lg:grid-cols-3 gap-4 p-6">

    <!-- ===== Left Column: Status + Telemetry ===== -->
    <div class="space-y-4">

      <!-- System State -->
      <section class="bg-gray-900/60 border border-gray-800 rounded-lg p-4">
        <h2 class="text-sm text-gray-400 uppercase tracking-wide mb-3">System State</h2>
        <div id="state-badge" class="text-2xl font-bold text-green-400">SYNCED</div>
        <div class="mt-2 grid grid-cols-3 gap-2 text-xs text-gray-500">
          <div>Streams <span id="stat-streams" class="block text-base text-gray-300">0</span></div>
          <div>Frictions <span id="stat-frictions" class="block text-base text-gray-300">0</span></div>
          <div>Footprints <span id="stat-footprints" class="block text-base text-gray-300">0</span></div>
        </div>
      </section>

      <!-- Telemetry Feed -->
      <section class="bg-gray-900/60 border border-gray-800 rounded-lg p-4 max-h-72 overflow-y-auto">
        <h2 class="text-sm text-gray-400 uppercase tracking-wide mb-3">Telemetry Feed</h2>
        <div id="telemetry-feed" class="space-y-1 text-xs">
          <p class="text-gray-600 italic">Awaiting data stream...</p>
        </div>
      </section>
    </div>

    <!-- ===== Center Column: SVG Machine Schematic ===== -->
    <div id="svg-container" class="golden-halo flex items-center justify-center bg-gray-900/40 border border-gray-800 rounded-lg p-6">
      <svg class="machine-svg" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
        <!-- Outer chassis -->
        <g id="chassis">
          <rect x="40" y="40" width="320" height="320" rx="24" ry="24"
                fill="none" stroke="#334155" stroke-width="2"/>
          <rect x="60" y="60" width="280" height="280" rx="16" ry="16"
                fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
        </g>

        <!-- Core reactor -->
        <g id="core-reactor">
          <circle cx="200" cy="200" r="60" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
          <circle cx="200" cy="200" r="40" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
          <circle id="reactor-heart" cx="200" cy="200" r="18" fill="#f59e0b" opacity="0.7"/>
        </g>

        <!-- Sensor array (4 cardinal nodes) -->
        <g id="sensor-array">
          <circle class="sensor-node" cx="200" cy="100" r="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
          <circle class="sensor-node" cx="300" cy="200" r="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
          <circle class="sensor-node" cx="200" cy="300" r="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
          <circle class="sensor-node" cx="100" cy="200" r="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
        </g>

        <!-- Connection lines -->
        <g id="connections" stroke="#334155" stroke-width="1" stroke-dasharray="4 4">
          <line x1="200" y1="110" x2="200" y2="160"/>
          <line x1="290" y1="200" x2="240" y2="200"/>
          <line x1="200" y1="290" x2="200" y2="240"/>
          <line x1="110" y1="200" x2="160" y2="200"/>
        </g>

        <!-- Data flow indicators -->
        <g id="data-flow">
          <circle class="flow-dot" cx="200" cy="135" r="3" fill="#f59e0b" opacity="0.6"/>
          <circle class="flow-dot" cx="265" cy="200" r="3" fill="#f59e0b" opacity="0.6"/>
          <circle class="flow-dot" cx="200" cy="265" r="3" fill="#f59e0b" opacity="0.6"/>
          <circle class="flow-dot" cx="135" cy="200" r="3" fill="#f59e0b" opacity="0.6"/>
        </g>

        <!-- Status text -->
        <text x="200" y="370" text-anchor="middle" fill="#64748b" font-size="11" font-family="monospace">
          DTS MACHINE SCHEMATIC
        </text>
      </svg>
    </div>

    <!-- ===== Right Column: Friction History + State Log ===== -->
    <div class="space-y-4">

      <!-- Friction History -->
      <section class="bg-gray-900/60 border border-gray-800 rounded-lg p-4 max-h-72 overflow-y-auto">
        <h2 class="text-sm text-gray-400 uppercase tracking-wide mb-3">Friction History</h2>
        <div id="friction-feed" class="space-y-1 text-xs">
          <p class="text-gray-600 italic">No friction events recorded.</p>
        </div>
      </section>

      <!-- State Transition Log -->
      <section class="bg-gray-900/60 border border-gray-800 rounded-lg p-4 max-h-72 overflow-y-auto">
        <h2 class="text-sm text-gray-400 uppercase tracking-wide mb-3">State Transitions</h2>
        <div id="state-log" class="space-y-1 text-xs">
          <p class="text-gray-600 italic">No transitions yet.</p>
        </div>
      </section>
    </div>

  </main>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
